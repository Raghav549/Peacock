plugins { id 'com.android.application' }

android {
    namespace 'org.peacock.shell'
    compileSdk 35
    defaultConfig {
        applicationId 'org.peacock.shell'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.4.0'
        externalNativeBuild { cmake { cppFlags '-std=c11' } }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
}
