[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peacock-ai"
version = "0.3.0"
description = "PEACOCK AI bootstrap toolchain (temporary; not the long-term implementation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PEACOCK AI contributors" }]
dependencies = []

[project.scripts]
peacock = "peacock.cli:main"

[tool.setuptools.packages.find]
include = ["peacock*"]

[tool.setuptools.package-data]
"peacock.vyakarana" = ["data/*.json", "data/*.md"]
