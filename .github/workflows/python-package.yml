# Complete CI pipeline for PEACOCK AI (Python 3.11+ bootstrap, .pac compiler,
# differential self-hosting checks, AI/frontend suites, website export, and release artifact validation).

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies and verify package build
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        python -m pip install -e .
    - name: Lint Python bootstrap with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run compiler, AI, frontend, security, documentation and differential suites
      run: |
        ./bin/peacock version
        ./bin/peacock test
    - name: Verify self-hosting kernels and differential semantic shadow
      run: |
        ./bin/peacock check selfhost/type_model.pac --semantic-shadow
        ./bin/peacock run selfhost/type_model.pac
        ./bin/peacock check selfhost/ir_model.pac --semantic-shadow
        ./bin/peacock run selfhost/ir_model.pac
    - name: Build and verify PEACOCK website from .pac source
      run: |
        ./bin/peacock check website/site.pac --semantic-shadow
        ./bin/peacock run website/site.pac --grant fs --root . --max-steps 20000000 -- website/dist
        ./bin/peacock build website/site.pac -o /tmp/peacock-website.pkb
    - name: Run deterministic fuzz smoke gates
      run: |
        ./bin/peacock fuzz --iterations 250 --seed 1
    - name: Upload verified website and bytecode release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: peacock-release-artifacts
        path: |
          website/dist/
          /tmp/peacock-website.pkb
